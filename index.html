<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原神｜週年慶生禮</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:28px 16px;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:#dfeffc;position:relative;overflow-x:hidden;color:#5f6f7e
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
  background-image:
    linear-gradient(45deg,transparent 46%,rgba(255,255,255,.9) 47%,rgba(255,255,255,.9) 53%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,rgba(255,255,255,.9) 47%,rgba(255,255,255,.9) 53%,transparent 54%);
  background-size:92px 92px;background-position:0 0,46px 46px
}
.card{
  position:relative;width:min(390px,94vw);background:rgba(255,255,255,.97);
  padding:24px 24px 28px;box-shadow:0 14px 38px rgba(91,132,164,.18)
}
.brand{
  text-align:center;color:#4d84a8;font-size:42px;font-weight:700;
  letter-spacing:.34em;margin:0 0 3px .34em
}
.subtitle{
  text-align:center;color:#7294ac;font-size:13px;letter-spacing:.12em;margin-bottom:22px
}
.banner{
  display:block;width:100%;aspect-ratio:344/199;object-fit:cover;border-radius:19px;
  box-shadow:0 8px 18px rgba(75,157,207,.28);margin-bottom:34px
}
.info{text-align:center;font-size:13px;line-height:2.35;color:#687783;margin-bottom:30px}
.info-title{margin-bottom:3px}
.cta{display:flex;justify-content:center}
.cta a{
  display:inline-flex;align-items:center;justify-content:center;min-width:176px;height:42px;
  padding:0 24px;border-radius:12px;background:#5b9bc4;color:white;text-decoration:none;
  font-size:14px;box-shadow:0 6px 14px rgba(72,141,184,.22);
  transition:transform .18s ease,filter .18s ease
}
.cta a:hover{transform:translateY(-2px);filter:brightness(1.05)}
.cta a span{margin-left:9px;font-size:18px;line-height:1}
.footer{margin-top:45px;padding-left:4px;font-size:10px;color:#a5aeb5}
@media(max-width:420px){
  .card{padding:20px 18px 24px}.brand{font-size:36px}.banner{margin-bottom:28px}
}
</style>
</head>
